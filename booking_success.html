    />
    <style>
      /* تنسيقات خاصة بصفحة التأكيد */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: var(--light-bg-color);
        font-family: 'Cairo', sans-serif;
      }
      .confirmation-card {
        background: var(--white-color);
        padding: 40px;
        border-radius: 10px;
        box-shadow: var(--box-shadow);
        text-align: center;
        max-width: 500px;
        margin: 20px;
        border-top: 5px solid var(--secondary-color); /* لون أخضر للنجاح */
      }
      .confirmation-icon {
        font-size: 5rem;
        color: var(--secondary-color);
        margin-bottom: 20px;
      }
      h2 {
        color: var(--primary-color);
        font-size: 2rem;
        margin-bottom: 15px;
      }
      p {
        font-size: 1.1rem;
        color: var(--text-color);
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="confirmation-card">
      <div class="confirmation-icon">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h2>تم تأكيد الحجز بنجاح!</h2>
      <p>شكراً لك. تم تسجيل موعدك وسنتواصل معك قريباً لتأكيد التفاصيل.</p>

    </div>
