<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>خطأ في الحجز | فاميلي كلينك</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      /* تنسيقات خاصة بصفحة التأكيد */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: var(--light-bg-color);
        font-family: 'Cairo', sans-serif;
      }
      .confirmation-card {
        background: var(--white-color);
        padding: 40px;
        border-radius: 10px;
        box-shadow: var(--box-shadow);
        text-align: center;
        max-width: 500px;
        margin: 20px;
        border-top: 5px solid #e74c3c; /* لون أحمر للخطأ */
      }
      .confirmation-icon {
        font-size: 5rem;
        color: #e74c3c;
        margin-bottom: 20px;
      }
      h2 {
        color: var(--primary-color);
        font-size: 2rem;
        margin-bottom: 15px;
      }
      p {
        font-size: 1.1rem;
        color: var(--text-color);
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="confirmation-card">
      <div class="confirmation-icon">
        <i class="fa-solid fa-circle-xmark"></i>
      </div>
      <h2>عذراً، حدث خطأ</h2>
      <p>
        لم نتمكن من تأكيد حجزك. يرجى المحاولة مرة أخرى أو الاتصال بنا مباشرة
        هاتفياً.
      </p>
      
      <a href="javascript:history.back()" class="btn" style="background-color: #e74c3c;"
        >الرجوع والمحاولة مرة أخرى</a
      >
    </div>
  </body>
</html>
